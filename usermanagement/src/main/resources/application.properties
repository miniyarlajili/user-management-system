spring.application.name=usermanagement
# ==============================
# DATABASE ? MySQL (XAMPP)
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/usermanagement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT
# ==============================
jwt.secret=MySuperSecretKey1234567890ABCDEFabcdef
jwt.expiration=86400000
logging.level.org.springframework.security=DEBUG

# ==============================
# Swagger
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==============================
# Server
# ==============================
server.port=8080