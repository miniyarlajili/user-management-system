<div class="page-header">
  <h5>Gestion des rôles</h5>
  <button class="btn-add" (click)="showForm = !showForm">
    <i class="bi bi-plus"></i> Nouveau rôle
  </button>
</div>

<!-- Form -->
<div class="form-card" *ngIf="showForm">
  <div class="alert-error" *ngIf="error">{{ error }}</div>
  <div class="form-grid">
    <div class="form-group">
      <label>Nom du rôle *</label>
      <input type="text" [(ngModel)]="newRole.nom"
             placeholder="ex: MODERATEUR">
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" [(ngModel)]="newRole.description"
             placeholder="Description du rôle">
    </div>
  </div>
  <div class="form-actions">
    <button class="btn-cancel" (click)="showForm = false">
      Annuler
    </button>
    <button class="btn-save" (click)="create()">
      <i class="bi bi-check-lg"></i> Créer
    </button>
  </div>
</div>

<!-- Table -->
<div class="card">
  <table class="table">
    <thead>
      <tr>
        <th>#</th>
        <th>Nom</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let role of roles">
        <td>{{ role.id }}</td>
        <td><span class="badge-role">{{ role.nom }}</span></td>
        <td>{{ role.description }}</td>
        <td>
          <button class="btn-delete" (click)="delete(role.id!)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
